# Privacy Guard MCP - 除外ルール設定
# 仕様書セクション5.2準拠
# マスキングから除外するパターン・ドメイン・文脈を定義する

exclusions:
  # ========================================
  # ドメイン除外（メールアドレス）
  # ========================================
  email_domains:
    - "example.com"
    - "example.jp"
    - "test.com"
    - "localhost"
    # 著名パブリックドメイン（マスク不要）
    - "gmail.com"      # ただし個人アドレスとして検知する場合は除外しない
    # 内部ドメインを除外したい場合はここに追加

  # ========================================
  # キーワード除外（固有名詞・一般名詞）
  # ========================================
  # これらの語は人名辞書にマッチしても除外する
  name_exclusion_keywords:
    # 一般名詞・役職名
    - "社長"
    - "部長"
    - "課長"
    - "担当"
    - "様"
    - "氏"
    - "さん"
    - "くん"
    - "ちゃん"
    # テスト用ダミーデータ
    - "テスト太郎"
    - "サンプル花子"
    - "ダミー"
    # 列ヘッダ・項目名（Excel/CSVで頻出。氏名検知の誤検知防止）
    # NAME_JA 正規表現や辞書マッチで両側のいずれかがこれらの語と完全一致する場合、
    # マスキング対象から除外する。
    - "電話番号"
    - "電話"
    - "FAX番号"
    - "FAX"
    - "メールアドレス"
    - "メール"
    - "Email"
    - "E-mail"
    - "住所"
    - "氏名"
    - "名前"
    - "担当者"
    - "担当"
    - "会社名"
    - "法人名"
    - "部署"
    - "役職"
    - "顧客ID"
    - "社員ID"
    - "法人ID"
    - "契約種別"
    - "契約"
    - "備考"
    - "メモ"
    - "TEL"
    - "Tel"
    - "Address"
    - "Name"
    - "Phone"
    - "備考欄"
    # システム関連の英語単語（NAME_EN等の人名検知から除外）
    - "localhost"
    - "127.0.0.1"
    - "0.0.0.0"
    - "ssh"
    - "https"
    - "http"
    - "tcp"
    - "udp"
    - "smtp"
    - "imap"
    - "pop3"
    - "ftp"

  # ========================================
  # 正規表現除外パターン
  # ========================================
  # これらのパターンにマッチするテキストはマスキング対象外
  regex_exclusions:
    # コードブロック内（Markdown）
    - pattern: "```[\\s\\S]*?```"
      reason: "コードブロック内の文字列は除外"
    # URLの一部
    - pattern: "https?://[^\\s]+"
      reason: "URLはそのまま保持"

  # ========================================
  # APIキー除外（低エントロピー・既知パターン）
  # ========================================
  api_key_exclusions:
    # サンプルキー・プレースホルダー
    - "YOUR_API_KEY"
    - "your-api-key"
    - "xxxxxxxx"
    - "XXXXXXXX"
    - "00000000"
    - "12345678"
    - "example_key"
    - "dummy_key"
    - "test_key"

  # ========================================
  # 除外ファイルタイプ（pg_read_file用 - Phase 3以降）
  # ========================================
  excluded_file_extensions:
    - ".gitignore"
    - ".gitattributes"
    - "LICENSE"
    - "LICENSE.txt"
