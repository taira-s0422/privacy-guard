[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "privacy-guard-mcp"
version = "1.0.0"
description = "Privacy Guard MCP Server - 個人情報・機密情報自動マスキングMCPサーバー"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "chardet>=5.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "pandas>=2.0.0",
    "faker>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["privacy_guard_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
